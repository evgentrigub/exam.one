# Optional local speech-to-text service for Speaking practice.
# The Parakeet model snapshot is downloaded to the host project directory and
# mounted read-only so container recreation never removes the weights.

name: exam-one-stt

services:
  parakeet:
    build:
      context: ./scripts/stt/parakeet
      dockerfile: Dockerfile
    ports:
      - '${STT_PORT:-8882}:8882'
    environment:
      PARAKEET_MODEL_DIR: /app/models
      PARAKEET_MODEL_ID: '${STT_MODEL:-nvidia/parakeet-tdt-0.6b-v3}'
      OMP_NUM_THREADS: '${STT_CPU_THREADS:-4}'
      TOKENIZERS_PARALLELISM: 'false'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_OFFLINE: '1'
    volumes:
      - ./scripts/stt/parakeet/models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8882/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    shm_size: 1gb
    restart: unless-stopped
