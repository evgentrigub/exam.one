name: exam-one

# One Compose project for the application, database, text-to-speech, and
# speech-to-text services. On the first run, use `pnpm stack:up` (or
# `pnpm stack:up:speech` after `stack:up:core`) so the TTS and STT model
# snapshots are downloaded to their gitignored host directories before Docker
# starts the model mounts. Only English TTS voices and the
# Cambridge A2 Key seed audio are prepared up front; other languages are
# downloaded and generated on demand from Settings → Generated files.
#
# PostgreSQL, Kokoro, and Parakeet publish on 127.0.0.1 (host-only). Change the
# bind to 0.0.0.0 only if you intentionally share those ports on the LAN.

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_FRONTEND_LANDING_URL: '${FRONTEND_LANDING_URL:-http://localhost:3001}'
      NUXT_PUBLIC_API_URL: 'http://localhost:${BACKEND_PORT:-3001}'
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      # Every pack's bundled seed WAVs and the per-user generated audio (`generated/`), one host
      # folder the backend writes and Settings → Generated files lists.
      - ./apps/frontend/public/audio/listening:/app/public/audio/listening:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      BACKEND_PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: 'http://localhost:${FRONTEND_PORT:-3000}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-exam_one}:${POSTGRES_PASSWORD:-exam_one}@postgres:5432/${POSTGRES_DB:-exam_one}?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JOBS_WORKER_ENABLED: '${JOBS_WORKER_ENABLED:-true}'
      BULL_BOARD_USER: '${BULL_BOARD_USER:-}'
      BULL_BOARD_PASSWORD: '${BULL_BOARD_PASSWORD:-}'
      JWT_SECRET: '${JWT_SECRET}'
      SECRETS_ENCRYPTION_KEY: '${SECRETS_ENCRYPTION_KEY}'
      AUTH_COOKIE_SECURE: '${AUTH_COOKIE_SECURE:-false}'
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-}'
      EMAIL_PROVIDER: '${EMAIL_PROVIDER:-none}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      SMTP_FROM: '${SMTP_FROM:-exam.one <noreply@localhost>}'
      TTS_BASE_URL: 'http://kokoro-voices:8881'
      TTS_CONCURRENCY: '${TTS_CONCURRENCY:-3}'
      TTS_SPEED: '${TTS_SPEED:-1.0}'
      TTS_LANG: '${TTS_LANG:-en}'
      TTS_LANGUAGES: '${TTS_LANGUAGES:-de,en,pl,es}'
      TTS_VOICES: '${TTS_VOICES:-martin,bernd,victoria,eva,bf_emma,bf_isabella,bm_george,bm_fable,pl_gosia,pl_darkman,pl_bass,ef_dora,em_alex,em_santa}'
      TTS_TURN_PAUSE_MS: '${TTS_TURN_PAUSE_MS:-350}'
      STT_BASE_URL: 'http://parakeet:8882'
      STT_LANGUAGES: '${STT_LANGUAGES:-de,en,pl,es}'
      SEED_LISTENING_AUDIO_DIR: /app/data/listening
      GENERATED_LISTENING_AUDIO_DIR: /app/data/listening/generated
      AUDIO_HOST_DISPLAY_ROOT: apps/frontend/public/audio/listening
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    volumes:
      - ./apps/frontend/public/audio/listening:/app/data/listening
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-exam_one}'
      POSTGRES_USER: '${POSTGRES_USER:-exam_one}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-exam_one}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-exam_one} -d ${POSTGRES_DB:-exam_one}'
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kokoro-voices:
    build:
      context: ./scripts/tts/victoria
      dockerfile: Dockerfile
    environment:
      KOKORO_VICTORIA_MODEL_DIR: /app/models
      # Voices are loaded from whatever is installed under /app/models; KOKORO_LANGS only picks
      # what `pnpm tts:setup` downloads up front (English). Other languages are downloaded from
      # Settings → Generated files → Voice models, which writes to this mount.
      KOKORO_LANGS: '${KOKORO_LANGS:-en}'
      KOKORO_MULTI_SPEED: '${TTS_SPEED:-1.0}'
      KOKORO_PAUSE_DURATION: '${TTS_PAUSE_DURATION:-0.25}'
      OMP_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      OPENBLAS_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      MKL_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      NUMEXPR_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
    ports:
      - '127.0.0.1:${TTS_PORT:-8881}:8881'
    volumes:
      - ./scripts/tts/victoria/models:/app/models
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8881/v1/audio/voices >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  parakeet:
    build:
      context: ./scripts/stt
      dockerfile: Dockerfile
    environment:
      STT_MODEL_DIR: /app/models
      STT_SETUP_LANGS: '${STT_SETUP_LANGS:-en}'
      STT_CPU_THREADS: '${STT_CPU_THREADS:-4}'
    ports:
      - '127.0.0.1:${STT_PORT:-8882}:8882'
    volumes:
      - ./scripts/stt/models:/app/models
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8882/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    restart: unless-stopped

volumes:
  redis_data:
    name: '${REDIS_VOLUME_NAME:-exam-one-redis-dev-data}'
  postgres_data:
    name: '${POSTGRES_VOLUME_NAME:-exam-one-postgres-dev-data}'
