name: exam-one

# One Compose project for the application, database, text-to-speech, and
# speech-to-text services. On the first run, use `pnpm stack:up` so the TTS and
# STT model snapshots are downloaded to their gitignored host directories
# before Docker starts the read-only model mounts.
#
# PostgreSQL, Kokoro, and Parakeet publish on 127.0.0.1 (host-only). Change the
# bind to 0.0.0.0 only if you intentionally share those ports on the LAN.

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_FRONTEND_LANDING_URL: '${FRONTEND_LANDING_URL:-http://localhost:3001}'
      NUXT_PUBLIC_API_URL: 'http://localhost:${BACKEND_PORT:-3001}'
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      - generated_listening_audio:/app/public/audio/listening/generated
      - ./apps/frontend/public/audio/listening/a2:/app/public/audio/listening/a2:ro
      - ./apps/frontend/public/audio/listening/a1:/app/public/audio/listening/a1:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      BACKEND_PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: 'http://localhost:${FRONTEND_PORT:-3000}'
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-exam_one}:${POSTGRES_PASSWORD:-exam_one}@postgres:5432/${POSTGRES_DB:-exam_one}?schema=public'
      JWT_SECRET: '${JWT_SECRET}'
      AUTH_COOKIE_SECURE: '${AUTH_COOKIE_SECURE:-false}'
      SWAGGER_ENABLED: '${SWAGGER_ENABLED:-}'
      EMAIL_PROVIDER: '${EMAIL_PROVIDER:-none}'
      SMTP_HOST: '${SMTP_HOST:-}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      SMTP_FROM: '${SMTP_FROM:-exam.one <noreply@localhost>}'
      LLM_PROVIDER: '${LLM_PROVIDER:-openrouter}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      OPENAI_MODEL: '${OPENAI_MODEL:-gpt-6-sol}'
      OPENROUTER_API_KEY: '${OPENROUTER_API_KEY:-}'
      OPENROUTER_MODEL: '${OPENROUTER_MODEL:-google/gemma-4-26b-a4b-it:free}'
      LLM_REASONING_EFFORT: '${LLM_REASONING_EFFORT:-medium}'
      TTS_BASE_URL: 'http://kokoro-voices:8881'
      TTS_CONCURRENCY: '${TTS_CONCURRENCY:-3}'
      TTS_SPEED: '${TTS_SPEED:-1.0}'
      TTS_LANG: '${TTS_LANG:-de}'
      TTS_LANGUAGES: '${TTS_LANGUAGES:-de,en,pl,es}'
      TTS_VOICES: '${TTS_VOICES:-martin,bernd,victoria,eva,bf_emma,bf_isabella,bm_george,bm_fable,pl_gosia,pl_darkman,pl_bass,ef_dora,em_alex,em_santa}'
      TTS_TURN_PAUSE_MS: '${TTS_TURN_PAUSE_MS:-350}'
      STT_PROVIDER: '${STT_PROVIDER:-local}'
      STT_BASE_URL: 'http://parakeet:8882'
      STT_MODEL: '${STT_MODEL:-handy-computer/parakeet-tdt-0.6b-v3-gguf:Q8_0}'
      STT_LANGUAGES: '${STT_LANGUAGES:-de,en,pl,es}'
      STT_OPENAI_MODEL: '${STT_OPENAI_MODEL:-whisper-1}'
      GENERATED_LISTENING_AUDIO_DIR: /app/data/listening/generated
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    volumes:
      - generated_listening_audio:/app/data/listening/generated
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-exam_one}'
      POSTGRES_USER: '${POSTGRES_USER:-exam_one}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-exam_one}'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-exam_one} -d ${POSTGRES_DB:-exam_one}'
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kokoro-voices:
    build:
      context: ./scripts/tts/victoria
      dockerfile: Dockerfile
    environment:
      KOKORO_VICTORIA_MODEL_DIR: /app/models
      # German, British English and Spanish on Kokoro (English and Spanish share one base
      # model, about 0.5 GiB of memory) and Polish on Piper (about 0.3 GiB).
      KOKORO_LANGS: '${KOKORO_LANGS:-de,en,pl,es}'
      KOKORO_MULTI_SPEED: '${TTS_SPEED:-1.0}'
      KOKORO_PAUSE_DURATION: '${TTS_PAUSE_DURATION:-0.25}'
      OMP_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      OPENBLAS_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      MKL_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
      NUMEXPR_NUM_THREADS: '${TTS_CPU_THREADS:-2}'
    ports:
      - '127.0.0.1:${TTS_PORT:-8881}:8881'
    volumes:
      - ./scripts/tts/victoria/models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8881/v1/audio/voices >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    restart: unless-stopped

  parakeet:
    build:
      context: ./scripts/stt/parakeet
      dockerfile: Dockerfile
    environment:
      PARAKEET_MODEL_DIR: /app/models
      PARAKEET_MODEL_FILE: parakeet-tdt-0.6b-v3-Q8_0.gguf
      PARAKEET_MODEL_ID: handy-computer/parakeet-tdt-0.6b-v3-gguf:Q8_0
      STT_CPU_THREADS: '${STT_CPU_THREADS:-4}'
    ports:
      - '127.0.0.1:${STT_PORT:-8882}:8882'
    volumes:
      - ./scripts/stt/parakeet/models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8882/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    restart: unless-stopped

volumes:
  postgres_data:
    name: '${POSTGRES_VOLUME_NAME:-exam-one-postgres-dev-data}'
  generated_listening_audio:
