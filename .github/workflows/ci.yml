# Lint, type-check, unit tests and build for every pull request and push to main. When they pass,
# the E2E suite in evgentrigub/exam-one-e2e is started for the same commit; it reports back to
# the commit as the "e2e" status.
#
# Secret E2E_DISPATCH_TOKEN: fine-grained token for evgentrigub/exam-one-e2e with
# Contents: read and write (needed to send a repository_dispatch event).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Nuxt scripts read ../../.env; the example has no secrets and is enough to build.
      - name: Environment for the build
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # Before the tests: workspace packages (e.g. @exam-one/database) resolve to their dist/.
      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Locale parity
        run: pnpm i18n:check

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the E2E suite for this commit
        env:
          GH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh api repos/evgentrigub/exam-one-e2e/dispatches \
            -f event_type=app-commit \
            -f "client_payload[sha]=${SHA}"
          echo "E2E started for ${SHA}; its result appears on the commit as the \"e2e\" status." >> "$GITHUB_STEP_SUMMARY"
