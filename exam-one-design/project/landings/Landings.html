<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; scroll-behavior: smooth; }
  .font-display { font-family: 'Fraunces', serif; font-feature-settings: "ss01"; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .ring-soft { box-shadow: 0 0 0 1px color-mix(in oklab, var(--color-base-content) 8%, transparent); }
  .grid-pattern {
    background-image:
      linear-gradient(color-mix(in oklab, var(--color-base-content) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in oklab, var(--color-base-content) 5%, transparent) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .dot-pattern {
    background-image: radial-gradient(color-mix(in oklab, var(--color-base-content) 12%, transparent) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .kbd-shadow { box-shadow: 0 2px 0 color-mix(in oklab, var(--color-base-content) 20%, transparent); }

  /* ring progress — donut */
  .ring-prog {
    position: relative; width: 64px; height: 64px; border-radius: 50%;
    --p: 0; --c: var(--color-primary);
    background: conic-gradient(var(--c) calc(var(--p)*1%), color-mix(in oklab, var(--color-base-content) 12%, transparent) 0);
    display: grid; place-items: center; flex: none;
  }
  .ring-prog::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--color-base-100); }
  .ring-prog > span { position: relative; z-index: 1; font-weight: 700; font-size: .78rem; font-family: 'JetBrains Mono', monospace; }

  /* spark bars */
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
  .spark > span { width: 4px; background: currentColor; border-radius: 2px; opacity: .85; }

  /* skill semantic colors */
  .text-reading { color: var(--color-primary); }
  .text-writing { color: var(--color-success); }
  .text-listening { color: var(--color-info); }
  .text-speaking { color: var(--color-warning); }
  .bg-reading-soft  { background: color-mix(in oklab, var(--color-primary) 12%, transparent); }
  .bg-writing-soft  { background: color-mix(in oklab, var(--color-success) 14%, transparent); }
  .bg-listening-soft{ background: color-mix(in oklab, var(--color-info) 14%, transparent); }
  .bg-speaking-soft { background: color-mix(in oklab, var(--color-warning) 18%, transparent); }

  .level-pip { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: color-mix(in oklab, var(--color-base-content) 8%, transparent); }

  .card-hov { transition: transform 180ms cubic-bezier(0,0,0.2,1), box-shadow 180ms; }
  .card-hov:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -16px color-mix(in oklab, var(--color-base-content) 30%, transparent); }

  ::selection { background: color-mix(in oklab, var(--color-primary) 30%, transparent); }

  /* Tailwind Play CDN doesn't generate daisyUI color utilities, so solid btn
     variants would otherwise inherit base-content (dark-on-dark). Pin their
     foreground to the matching content token. */
  .btn-neutral { color: var(--color-neutral-content) !important; }
  .btn-primary { color: var(--color-primary-content) !important; }

  /* waveform */
  .wave-bar { background: currentColor; border-radius: 2px; display:inline-block; width: 3px; }

  /* reveal on scroll */
  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s cubic-bezier(0,0,.2,1), transform .6s cubic-bezier(0,0,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  /* switcher bar */
  .switch-bar { position: fixed; z-index: 100; left: 50%; transform: translateX(-50%); bottom: 22px; }

  /* highlight mark for writing feedback */
  mark.fb-good { background: color-mix(in oklab, var(--color-success) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
  mark.fb-bad  { background: color-mix(in oklab, var(--color-error) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; text-decoration: underline wavy color-mix(in oklab, var(--color-error) 60%, transparent); text-underline-offset: 3px; }

  .hero-noise { background-image: radial-gradient(color-mix(in oklab,#ffffff 6%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
</style>
</head>

</body>
