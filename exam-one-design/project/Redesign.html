<style>
  html, body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  .font-display { font-family: 'Fraunces', serif; font-feature-settings: "ss01","ss02"; letter-spacing: -0.02em; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  /* --- subtle custom touches, consistent with daisyUI --- */
  .ring-soft { box-shadow: 0 0 0 1px color-mix(in oklab, var(--color-base-content) 8%, transparent); }
  .grid-pattern {
    background-image:
      linear-gradient(color-mix(in oklab, var(--color-base-content) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in oklab, var(--color-base-content) 5%, transparent) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .dot-pattern {
    background-image: radial-gradient(color-mix(in oklab, var(--color-base-content) 12%, transparent) 1px, transparent 1px);
    background-size: 14px 14px;
  }
  .kbd-shadow { box-shadow: 0 2px 0 color-mix(in oklab, var(--color-base-content) 20%, transparent); }
  .exam-skill-chip { transition: all 180ms cubic-bezier(0,0,0.2,1); }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -4px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .wave-bar { background: currentColor; border-radius: 2px; display:inline-block; width: 3px; }
  @keyframes pulsebar { 0%,100%{ transform: scaleY(0.3);} 50%{ transform: scaleY(1);} }
  .wave-live .wave-bar { animation: pulsebar 1s ease-in-out infinite; transform-origin: center; }
  .wave-live .wave-bar:nth-child(2) { animation-delay: .1s }
  .wave-live .wave-bar:nth-child(3) { animation-delay: .2s }
  .wave-live .wave-bar:nth-child(4) { animation-delay: .15s }
  .wave-live .wave-bar:nth-child(5) { animation-delay: .05s }

  /* spark bars */
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; }
  .spark > span { width: 4px; background: currentColor; border-radius: 2px; opacity: .85; }

  /* ring progress — donut with centered label */
  .ring-prog {
    position: relative; width: 64px; height: 64px; border-radius: 50%;
    --p: 0; --c: var(--color-primary);
    background: conic-gradient(var(--c) calc(var(--p)*1%), color-mix(in oklab, var(--color-base-content) 12%, transparent) 0);
    display: grid; place-items: center; flex: none;
  }
  .ring-prog::before {
    content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--color-base-100);
  }
  .ring-prog > span { position: relative; z-index: 1; font-weight: 700; font-size: .78rem; font-family: 'JetBrains Mono', monospace; }

  /* soft highlight for active sidebar */
  .nav-item-active { background: color-mix(in oklab, var(--color-primary) 10%, transparent); color: var(--color-primary); }

  /* annotation pill for audit mode */
  .audit-pill { position: absolute; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--color-warning); color: var(--color-warning-content); box-shadow: 0 2px 0 rgba(0,0,0,.1); z-index: 30; }

  /* full-height shell */
  .app-shell { height: 100vh; }

  /* subtle card hover */
  .card-hov { transition: transform 180ms cubic-bezier(0,0,0.2,1), box-shadow 180ms; }
  .card-hov:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -12px color-mix(in oklab, var(--color-base-content) 25%, transparent); }

  /* mini spark colors inherit */
  .text-reading { color: var(--color-primary); }
  .text-writing { color: var(--color-success); }
  .text-listening { color: var(--color-info); }
  .text-speaking { color: var(--color-warning); }
  .bg-reading-soft  { background: color-mix(in oklab, var(--color-primary) 12%, transparent); }
  .bg-writing-soft  { background: color-mix(in oklab, var(--color-success) 14%, transparent); }
  .bg-listening-soft{ background: color-mix(in oklab, var(--color-info) 14%, transparent); }
  .bg-speaking-soft { background: color-mix(in oklab, var(--color-warning) 18%, transparent); }

  /* exam level pip */
  .level-pip { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 10px; padding: 2px 6px; border-radius: 4px;
    background: color-mix(in oklab, var(--color-base-content) 8%, transparent); }

  /* ::selection */
  ::selection { background: color-mix(in oklab, var(--color-primary) 30%, transparent); }
</style>
