name: exam-one-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-exam_one}'
      POSTGRES_USER: '${POSTGRES_USER:-exam_one}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-exam_one}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-exam_one} -d ${POSTGRES_DB:-exam_one}'
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: exam-one-postgres-dev-data
