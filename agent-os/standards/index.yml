auth:
  apifetch-refresh:
    description: credentials include; 401 refresh once; skip auth cookie-mutating paths
  cookie-session:
    description: HttpOnly exam_one_access JWT + hashed exam_one_refresh; no localStorage tokens
  jwt-guard-public:
    description: Global JwtAuthGuard; @Public only for health and unauthenticated auth actions
  jwt-secret:
    description: JWT_SECRET ≥32 chars; reject empty and change-me-in-production at boot
  login-lockout:
    description: 5 failed logins per email in 15m → 429; dummy bcrypt on missing users
  nuxt-auth-gate:
    description: Client-only auth.global middleware; /auth SSR, rest ssr:false; safe redirect
  optional-email-verification:
    description: SMTP optional; unverified sessions still work; UI routes to /auth/verify

components:
  card-layout:
    description: daisyUI card structure, colored header convention, and stretch/scroll rules for feature cards
  icons:
    description: Use @nuxt/icon with heroicons set; contextual size scale; bundle icons for reliable self-host without CDN; replace legacy inline SVGs when touched
  import-aliases:
    description: Always use the ~/ alias for project imports; forbid ../ relative parent paths (ESLint-enforced)
  shared-label-maps:
    description: Centralize text/topic type label and badge-class maps in utils/labels.ts; route labels through i18n
  ssr-hydration-guard:
    description: Guard client-only reads (localStorage, persisted Pinia, window, session profile) with ClientOnly or an isClient ref; gated app is ssr:false
  state-class-helpers:
    description: Map state to daisyUI utility strings via named computed/function helpers; promote shared logic to composables
  theme-tokens:
    description: Use daisyUI semantic color tokens only (base-*, primary, success, ...); forbid raw Tailwind color scales

composables:
  naming-and-shape:
    description: use* prefix, feature-scoped; return object with // State and // Methods sections; readonly for singleton state, writable for per-caller

database:
  json-payloads:
    description: Exam-specific content in Json columns; add Prisma columns only for filter/index fields
  migrations:
    description: Local migrate dev; Docker boot migrate deploy then seed; never edit applied SQL
  package-ownership:
    description: '`@exam-one/database` owns schema, migrations, seed; Nest uses PrismaService'
  partial-unique-indexes:
    description: SQL-only unique indexes for seed Exercise and MockExamSet; do not drop
  seed-upsert-overlay:
    description: Seed upsert `userId` null; user overlay by externalId; SEED_LOCKED / SEED_ID

exam-content:
  exam-agnostic-core:
    description: Goethe belongs in exam-content and data/packs; Nest/Prisma/generic UI stay generic
  exam-only-vs-practice:
    description: default vs mockExam vs allDefault arrays; practice lists hide examOnly
  exercise-ids:
    description: Payload id is externalId; `{skill}-{level}-teil{n}-{seq}` and mock-a2-set1-*
  listening-audio-paths:
    description: Seed WAV helpers under /audio/listening/a2; generated files stay out of that tree
  seeds-vs-prompts:
    description: Seeds in exam-content; prompts in data/src/packs; prompts should not move into Nest

global:
  localstorage-keys:
    description: 'Practice data is API-backed; remaining client keys are theme/locale/playback/bookmarks; no secrets; const at top of owning files'
  offline-first-core:
    description: 'Core practice is login-gated Nest accounts, Postgres-backed practice data, Nest AI/TTS/STT, Goethe A2 live pack, BYOK AI, exam-content seed + API hydrate'
  self-host-persistence:
    description: 'Docker Compose localhost stack: accounts, practice data, AI/TTS/STT, named volumes, README runbook; no required cloud'
  ssr-storage-guards:
    description: 'Guard every localStorage/window/document access with import.meta.client; wrap reads in try/catch; never at module top level; applies wherever browser storage remains'

server:
  ai-response-envelope:
    description: 'BYOK AI endpoints (OpenAI/OpenRouter) return `{ data: T | null, error: string | null }` with HTTP 200 for business failures; NestJS `/api/v1` owns the proxy'
  contracts-dto-mappers:
    description: Map Prisma rows to `@exam-one/contracts` DTOs in common/mappers; ISO dates
  exception-codes:
    description: SNAKE_CASE `{ code, message }` on Nest HTTP exceptions; tests assert on code
  feature-module-layout:
    description: One folder per resource (controller/service/dto/module); Prisma via nestjs-libraries
  request-validation:
    description: class-validator DTOs; ValidationPipe whitelist + forbidNonWhitelisted + transform
  rest-response-envelope:
    description: REST `{ data }` envelope; throw HTTP exceptions on failure; distinct from AI envelope
  security-headers:
    description: Helmet on Nest without API CSP; Swagger off in production unless SWAGGER_ENABLED; Nuxt frame-ancestors
  uri-versioning:
    description: Global prefix api + URI v1 → `/api/v1`; Swagger at `/api/docs`

styling:
  daisyui-setup:
    description: Tailwind v4 + daisyUI v5 single-pipeline setup via main.css and @tailwindcss/vite; enable only exposed themes
  theme-catalog:
    description: Single source of truth for themes in useTheme.ts (Theme union + LIGHT/DARK arrays); useState + localStorage UI pref, not Pinia
  theming-mechanism:
    description: Switch themes via data-theme on <html> through useTheme().setTheme; no manual toggles, no dark variants needed

testing:
  ai-envelope-tests:
    description: 'AI business failures assert `{ data: null, error }`; mock LlmService; no network'
  frontend-no-unit-suite:
    description: No frontend unit/e2e yet; don't add a runner unless asked; browser-check UI
  nest-unit-mocks:
    description: Colocate specs; mock PrismaService; fixtures + assert exception codes
  unit-vs-e2e:
    description: pnpm test is unit without Postgres; e2e is supertest + real DB for auth/health

