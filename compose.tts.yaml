# Optional four-voice Kokoro TTS for listening audio generation.
# Single PyTorch service on :8881 (martin, bernd, victoria, eva).
# Not required for normal app runtime — seed WAVs ship under public/audio/.
#
# Setup (once):
#   bash scripts/tts/victoria/download-models.sh
#   pnpm tts:up
#   pnpm generate:listening-audio
#   pnpm tts:down
#
# Client env (defaults match this compose file):
#   TTS_BASE_URL=http://127.0.0.1:8881
#   TTS_CONCURRENCY=3

name: exam-one-tts

services:
  kokoro-voices:
    build:
      context: ./scripts/tts/victoria
      dockerfile: Dockerfile
    ports:
      - '${TTS_PORT:-8881}:8881'
    environment:
      KOKORO_VICTORIA_MODEL_DIR: /app/models
      KOKORO_MULTI_SPEED: '1.0'
      KOKORO_PAUSE_DURATION: '0.25'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    volumes:
      - ./scripts/tts/victoria/models:/app/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8881/v1/audio/voices >/dev/null'
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s
    restart: unless-stopped
