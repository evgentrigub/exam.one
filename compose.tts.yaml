# Optional Kokoro German Martin TTS service for generating listening audio assets.
# Not required for normal app runtime — seed WAVs ship under apps/frontend/public/audio/.
#
# Setup (once):
#   ./scripts/tts/setup-kokoro.sh
#   docker compose -f compose.tts.yaml up -d --build --wait
#   pnpm generate:listening-audio

name: exam-one-tts

services:
  kokoro-tts:
    build:
      context: ./scripts/tts/kokoro-german
      dockerfile: onnx-docker/Dockerfile
    ports:
      - '${TTS_PORT:-8881}:8881'
    environment:
      KOKORO_ONNX_THREADS: '2'
      KOKORO_ONNX_INTRA_OP_THREADS: '2'
      KOKORO_ONNX_INTER_OP_THREADS: '1'
      KOKORO_ONNX_EXECUTION_MODE: sequential
      KOKORO_ONNX_GRAPH_OPT: all
      KOKORO_ONNX_SPEED: '1.0'
      KOKORO_ONNX_TRIM: 'true'
      KOKORO_ONNX_VOICE: martin
      KOKORO_ONNX_LANG: de
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      OMP_WAIT_POLICY: PASSIVE
      KOKORO_PAUSE_DURATION: '0.25'
      KOKORO_WORKERS: '1'
      KOKORO_ONNX_ALLOW_SPINNING: '0'
      KOKORO_WARMUP_TEXT: Hallo.
    volumes:
      - ./scripts/tts/kokoro-german/german_text_rules.py:/app/german_text_rules.py:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://127.0.0.1:8881/v1/audio/voices >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
